<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified ISP Operations Dashboard - Staff KPI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f5f7; }
        .strict-row-nav { display: flex; flex-wrap: nowrap !important; overflow-x: auto; gap: 6px; align-items: center; }
        .strict-row-nav::-webkit-scrollbar { height: 4px; }
        .strict-row-nav::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="text-slate-900 font-semibold p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Staff Name Buttons Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div id="staff-buttons-container" class="strict-row-nav py-2">
                <!-- Dynamically loaded staff buttons -->
            </div>
        </div>

        <!-- Staff Details Card -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex items-center space-x-3 border-b border-slate-100 pb-4">
                <span class="bg-blue-100 text-blue-600 p-3 rounded-xl font-bold">👤</span>
                <div>
                    <h2 id="active-staff-name" class="text-xl font-extrabold text-slate-900">Soe Huan</h2>
                    <p class="text-xs text-slate-400 font-bold">Performance & Daily Activities</p>
                </div>
            </div>

            <!-- KPI & Leave Alert Notices -->
            <div id="staff-alerts-container" class="space-y-2">
                <!-- Populated via JS -->
            </div>

            <!-- Staff Activity Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs text-slate-400 uppercase tracking-wider bg-slate-50">
                            <th class="py-3 px-4">DATE</th>
                            <th class="py-3 px-4">DEVICE NAME</th>
                            <th class="py-3 px-4">DAILY (JD)</th>
                            <th class="py-3 px-4 text-center">TOTAL</th>
                            <th class="py-3 px-4 text-right">STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="staff-table-body" class="text-sm divide-y divide-slate-100">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const staffList = [
            "Aung Aung14", "Aung Myint Myat", "Aung Zaw Htet", "Chit Bhone", 
            "Htet Myat Hlaing", "Htet Naing Win4", "Min Maw Kun2", "Myat Htet Kyaw", 
            "Myat Zaw Soe", "Myint Kyaw Aung", "Myo Aung", "Phyo Wai Aung", 
            "Soe Huan", "Win Ko Oo", "Zin Khant"
        ];

        function initStaffKpi() {
            let container = document.getElementById('staff-buttons-container');
            container.innerHTML = "";
            staffList.forEach((name, idx) => {
                let btn = document.createElement('button');
                btn.innerText = name;
                btn.className = name === "Soe Huan"
                    ? 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow whitespace-nowrap' 
                    : 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap';
                btn.onclick = () => selectStaff(name, btn);
                container.appendChild(btn);
            });

            selectStaff("Soe Huan", container.children[12] || container.children[0]);
        }

        function selectStaff(name, btnElement) {
            document.querySelectorAll('#staff-buttons-container button').forEach(b => {
                b.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap';
            });
            if(btnElement) btnElement.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow whitespace-nowrap';
            document.getElementById('active-staff-name').innerText = name;

            // Render KPI Missed & Leave Alerts (Exact match to User Image)
            let alertsDiv = document.getElementById('staff-alerts-container');
            alertsDiv.innerHTML = `
                <div class="p-3 bg-red-50 border-l-4 border-red-500 text-red-800 text-xs font-bold rounded-r-xl">
                    ⚠️ ${name} No Meet Daily KPI. 2026-10-07 (Total: 104 / Target: 150)
                </div>
                <div class="p-3 bg-amber-50 border-l-4 border-amber-500 text-amber-800 text-xs font-bold rounded-r-xl">
                    ⚠️ ${name} is on Leave on 2026-10-12
                </div>
                <div class="p-3 bg-red-50 border-l-4 border-red-500 text-red-800 text-xs font-bold rounded-r-xl">
                    ⚠️ ${name} No Meet Daily KPI. 2026-10-14 (Total: 142 / Target: 150)
                </div>
            `;

            // Render Table (Exact match to User Image with Pass/Fail Status)
            let tbody = document.getElementById('staff-table-body');
            tbody.innerHTML = `
                <!-- 2026-10-01 -->
                <tr class="hover:bg-slate-50/50">
                    <td class="py-3 px-4 text-slate-600 font-bold align-middle" rowspan="2">2026-10-01</td>
                    <td class="py-3 px-4 text-slate-400 align-middle">-</td>
                    <td class="py-3 px-4 text-slate-700">MAC</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">50</td>
                    <td class="py-3 px-4 text-right align-middle" rowspan="2"></td>
                </tr>
                <tr class="hover:bg-slate-50/50 border-b border-slate-200">
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle">FFO</td>
                    <td class="py-3 px-4 text-slate-700">Lan Port Test</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">150</td>
                </tr>
                <tr class="bg-slate-50/80 border-b border-slate-200">
                    <td colspan="3" class="py-2.5 px-4 text-right text-slate-500 text-xs font-bold uppercase">Daily Total:</td>
                    <td class="py-2.5 px-4 text-center font-black text-slate-900">200</td>
                    <td class="py-2.5 px-4 text-right font-black text-emerald-600">Pass (200)</td>
                </tr>

                <!-- 2026-10-02 -->
                <tr class="hover:bg-slate-50/50">
                    <td class="py-3 px-4 text-slate-600 font-bold align-middle" rowspan="2">2026-10-02</td>
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle">Exchange Test</td>
                    <td class="py-3 px-4 text-slate-700">Exchange Test</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">32</td>
                    <td class="py-3 px-4 text-right align-middle" rowspan="2"></td>
                </tr>
                <tr class="hover:bg-slate-50/50 border-b border-slate-200">
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle">FFO</td>
                    <td class="py-3 px-4 text-slate-700">Lan Port Test</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">75</td>
                </tr>
                <tr class="bg-slate-50/80 border-b border-slate-200">
                    <td colspan="3" class="py-2.5 px-4 text-right text-slate-500 text-xs font-bold uppercase">Daily Total:</td>
                    <td class="py-2.5 px-4 text-center font-black text-slate-900">107</td>
                    <td class="py-2.5 px-4 text-right font-black text-rose-600">Fail (107)</td>
                </tr>

                <!-- 2026-10-03 -->
                <tr class="hover:bg-slate-50/50 border-b border-slate-200">
                    <td class="py-3 px-4 text-slate-600 font-bold align-middle">2026-10-03</td>
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle">FFO</td>
                    <td class="py-3 px-4 text-slate-700">Lan Port Test</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">534</td>
                    <td class="py-3 px-4 text-right font-black text-emerald-600 align-middle">Pass (534)</td>
                </tr>

                <!-- 2026-10-06 -->
                <tr class="hover:bg-slate-50/50 border-b border-slate-200">
                    <td class="py-3 px-4 text-slate-600 font-bold align-middle">2026-10-06</td>
                    <td class="py-3 px-4 text-slate-400 align-middle">-</td>
                    <td class="py-3 px-4 text-slate-700">Exchange Test</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">80</td>
                    <td class="py-3 px-4 text-right font-black text-rose-600 align-middle">Fail (80)</td>
                </tr>

                <!-- 2026-10-07 -->
                <tr class="hover:bg-slate-50/50">
                    <td class="py-3 px-4 text-slate-600 font-bold align-middle" rowspan="2">2026-10-07</td>
                    <td class="py-3 px-4 text-slate-400 align-middle">-</td>
                    <td class="py-3 px-4 text-slate-700">MAC</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">20</td>
                    <td class="py-3 px-4 text-right align-middle" rowspan="2"></td>
                </tr>
                <tr class="hover:bg-slate-50/50 border-b border-slate-200">
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle">FFO</td>
                    <td class="py-3 px-4 text-slate-700">RMA</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">84</td>
                </tr>
                <tr class="bg-slate-50/80 border-b border-slate-200">
                    <td colspan="3" class="py-2.5 px-4 text-right text-slate-500 text-xs font-bold uppercase">Daily Total:</td>
                    <td class="py-2.5 px-4 text-center font-black text-slate-900">104</td>
                    <td class="py-2.5 px-4 text-right font-black text-rose-600">Fail (104)</td>
                </tr>

                <!-- 2026-10-08 -->
                <tr class="hover:bg-slate-50/50 border-b border-slate-200">
                    <td class="py-3 px-4 text-slate-600 font-bold align-middle">2026-10-08</td>
                    <td class="py-3 px-4 text-slate-400 align-middle">-</td>
                    <td class="py-3 px-4 text-slate-700">RMA</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600">178</td>
                    <td class="py-3 px-4 text-right font-black text-emerald-600 align-middle">Pass (178)</td>
                </tr>
            `;
        }

        window.onload = function() {
            initStaffKpi();
        };
    </script>
</body>
</html>
