<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified ISP Operations Dashboard - Staff KPI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f5f7; }
        .strict-row-nav { display: flex; flex-wrap: nowrap !important; overflow-x: auto; gap: 6px; align-items: center; }
        .strict-row-nav::-webkit-scrollbar { height: 4px; }
        .strict-row-nav::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="text-slate-900 font-semibold p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Staff Name Buttons Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div id="staff-buttons-container" class="strict-row-nav py-2">
                <span class="text-xs text-slate-400 font-bold px-2">Loading Staff Members...</span>
            </div>
        </div>

        <!-- Staff Details Card -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex items-center space-x-3 border-b border-slate-100 pb-4">
                <span class="bg-blue-100 text-blue-600 p-3 rounded-xl font-bold">👤</span>
                <div>
                    <h2 id="active-staff-name" class="text-xl font-extrabold text-slate-900">Select a Staff</h2>
                    <p class="text-xs text-slate-400 font-bold">Performance & Daily Activities</p>
                </div>
            </div>

            <!-- Dynamic Alerts (KPI Missed & Leave) -->
            <div id="staff-alerts-container" class="space-y-2">
                <!-- Dynamic Content -->
            </div>

            <!-- Staff Activity Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs text-slate-400 uppercase tracking-wider bg-slate-50">
                            <th class="py-3 px-4">DATE</th>
                            <th class="py-3 px-4">DEVICE NAME</th>
                            <th class="py-3 px-4">DAILY (JD)</th>
                            <th class="py-3 px-4 text-center">TOTAL</th>
                            <th class="py-3 px-4 text-right">STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="staff-table-body" class="text-sm divide-y divide-slate-100">
                        <tr><td colspan="5" class="py-6 text-center text-slate-400">Fetching live data from Google Sheet...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const STAFF_SHEET_ID = "14WOHloWhGuQOc95PrRUsYWAHT6PTCC6EL2pY18uglVs";
        const SHEET_NAME = "Oct 26";
        const TARGET_KPI = 150;

        let rawSheetData = [];
        let staffGroupedData = {};

        async function fetchStaffData() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${STAFF_SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substring(47, text.length - 2));
                
                const cols = json.table.cols.map(c => (c && c.label) ? c.label.trim() : '');
                const rows = json.table.rows.map(r => r.c.map(cell => cell ? (cell.v !== null ? cell.v : '') : ''));

                rawSheetData = rows.map(row => {
                    let obj = {};
                    cols.forEach((col, idx) => { if(col) obj[col] = row[idx]; });
                    return obj;
                });

                processStaffData();
            } catch (err) {
                console.error("Error fetching staff sheet:", err);
                document.getElementById('staff-table-body').innerHTML = `<tr><td colspan="5" class="py-6 text-center text-rose-500 font-bold">Failed to load Google Sheet data. Check connection.</td></tr>`;
            }
        }

        function processStaffData() {
            staffGroupedData = {};

            rawSheetData.forEach(row => {
                let name = String(row['Staff Name'] || row['Name'] || row['STAFF'] || '').trim();
                let dateRaw = row['Date'] || row['DATE'] || '';
                let device = row['Device Name'] || row['DEVICE NAME'] || row['Device'] || '-';
                let jd = row['Daily (JD)'] || row['DAILY (JD)'] || row['Activity'] || '-';
                let qty = parseFloat(row['Quantity'] || row['QTY'] || row['Total'] || row['Count'] || 0) || 0;
                let isLeave = String(row['Leave'] || row['STATUS'] || '').toLowerCase().includes('leave');

                if (!name) return;

                let dateStr = "";
                if (typeof dateRaw === 'string' && dateRaw.startsWith('Date(')) {
                    let parts = dateRaw.match(/\d+/g);
                    if (parts) {
                        let d = new Date(parts[0], parts[1], parts[2]);
                        dateStr = d.toISOString().split('T')[0];
                    }
                } else if (dateRaw) {
                    dateStr = String(dateRaw).split('T')[0];
                }

                if (!staffGroupedData[name]) {
                    staffGroupedData[name] = { leaves: new Set(), dates: {} };
                }

                if (isLeave && dateStr) {
                    staffGroupedData[name].leaves.add(dateStr);
                }

                if (dateStr && qty > 0) {
                    if (!staffGroupedData[name].dates[dateStr]) {
                        staffGroupedData[name].dates[dateStr] = [];
                    }
                    staffGroupedData[name].dates[dateStr].push({ device, jd, qty });
                }
            });

            renderStaffButtons();
        }

        function renderStaffButtons() {
            let staffList = Object.keys(staffGroupedData).sort();
            let container = document.getElementById('staff-buttons-container');
            container.innerHTML = "";

            if (staffList.length === 0) {
                container.innerHTML = `<span class="text-xs text-rose-500 font-bold px-2">No staff data found in Sheet.</span>`;
                return;
            }

            staffList.forEach((name, idx) => {
                let btn = document.createElement('button');
                btn.innerText = name;
                btn.className = idx === 0 
                    ? 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow whitespace-nowrap' 
                    : 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap';
                btn.onclick = () => selectStaff(name, btn);
                container.appendChild(btn);
            });

            selectStaff(staffList[0], container.children[0]);
        }

        function selectStaff(name, btnElement) {
            document.querySelectorAll('#staff-buttons-container button').forEach(b => {
                b.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap';
            });
            if(btnElement) btnElement.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow whitespace-nowrap';
            
            document.getElementById('active-staff-name').innerText = name;

            let sData = staffGroupedData[name] || { leaves: new Set(), dates: {} };
            let alertsHtml = "";

            // Render Staff Specific Leave Alerts
            sData.leaves.forEach(date => {
                alertsHtml += `
                    <div class="p-3 bg-amber-50 border-l-4 border-amber-500 text-amber-800 text-xs font-bold rounded-r-xl">
                        ⚠️ ${name} is on Leave on ${date}
                    </div>
                `;
            });

            let sortedDates = Object.keys(sData.dates).sort();
            let tableRowsHtml = "";

            if (sortedDates.length === 0) {
                tableRowsHtml = `<tr><td colspan="5" class="py-6 text-center text-slate-400 font-bold">No activity records found for ${name}.</td></tr>`;
            }

            sortedDates.forEach(date => {
                let items = sData.dates[date];
                let dailyTotal = items.reduce((sum, item) => sum + item.qty, 0);

                // Add KPI miss alert for days where target wasn't met
                if (dailyTotal < TARGET_KPI) {
                    alertsHtml += `
                        <div class="p-3 bg-red-50 border-l-4 border-red-500 text-red-800 text-xs font-bold rounded-r-xl">
                            ⚠️ ${name} No Meet Daily KPI. ${date} (Total: ${dailyTotal} / Target: ${TARGET_KPI})
                        </div>
                    `;
                }

                let passFailBadge = dailyTotal >= TARGET_KPI 
                    ? `<span class="font-black text-emerald-600">Pass (${dailyTotal})</span>`
                    : `<span class="font-black text-rose-600">Fail (${dailyTotal})</span>`;

                items.forEach((item, index) => {
                    tableRowsHtml += `
                        <tr class="hover:bg-slate-50/50">
                            ${index === 0 ? `<td class="py-3 px-4 text-slate-600 font-bold align-middle" rowspan="${items.length}">${date}</td>` : ''}
                            <td class="py-3 px-4 font-bold text-slate-800 align-middle">${item.device}</td>
                            <td class="py-3 px-4 text-slate-700">${item.jd}</td>
                            <td class="py-3 px-4 text-center font-bold text-blue-600">${item.qty}</td>
                            ${index === 0 ? `<td class="py-3 px-4 text-right align-middle" rowspan="${items.length}">${passFailBadge}</td>` : ''}
                        </tr>
                    `;
                });

                // Add Daily Summary Row
                tableRowsHtml += `
                    <tr class="bg-slate-50/80 border-b border-slate-200">
                        <td colspan="3" class="py-2.5 px-4 text-right text-slate-500 text-xs font-bold uppercase">Daily Total:</td>
                        <td class="py-2.5 px-4 text-center font-black text-slate-900">${dailyTotal}</td>
                        <td class="py-2.5 px-4 text-right">${passFailBadge}</td>
                    </tr>
                `;
            });

            document.getElementById('staff-alerts-container').innerHTML = alertsHtml;
            document.getElementById('staff-table-body').innerHTML = tableRowsHtml;
        }

        window.onload = function() {
            fetchStaffData();
        };
    </script>
</body>
</html>
