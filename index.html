<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONU Inspection Report Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for CSV reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header Section with Test Switcher Tabs -->
    <header class="bg-indigo-600 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="bg-white p-2 rounded-lg shadow text-indigo-600 font-bold">ONU</span>
                <h1 class="text-xl sm:text-2xl font-bold text-white">ONU Inspection Report Dashboard</h1>
            </div>
            
            <!-- Test Switcher Tabs -->
            <div class="flex bg-indigo-700 p-1 rounded-xl shadow-inner">
                <button id="tab-first" onclick="switchTestType('first')" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-white bg-indigo-500 shadow transition">First Test</button>
                <button id="tab-second" onclick="switchTestType('second')" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-indigo-200 hover:text-white transition">Second Test</button>
                <button id="tab-exchange" onclick="switchTestType('exchange')" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-indigo-200 hover:text-white transition">Exchange Devices</button>
                <button id="tab-weekly" onclick="switchTestType('weekly')" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-indigo-200 hover:text-white transition">Weekly</button>
                <button id="tab-monthly" onclick="switchTestType('monthly')" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-indigo-200 hover:text-white transition">Monthly</button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- Region Filter Buttons -->
        <div class="flex flex-wrap gap-2 mb-6" id="region-filters">
            <button onclick="filterByRegion('All')" class="px-4 py-2 bg-indigo-600 text-white rounded-lg shadow font-medium text-sm">All Regions</button>
            <button onclick="filterByRegion('OVF-Provision-HGAO')" class="px-4 py-2 bg-white text-gray-700 hover:bg-gray-50 rounded-lg shadow font-medium text-sm">OVF-Provision-HGAO</button>
            <button onclick="filterByRegion('OVF-Provision-ENUO')" class="px-4 py-2 bg-white text-gray-700 hover:bg-gray-50 rounded-lg shadow font-medium text-sm">OVF-Provision-ENUO</button>
            <button onclick="filterByRegion('OVF-Provision-MDY')" class="px-4 py-2 bg-white text-gray-700 hover:bg-gray-50 rounded-lg shadow font-medium text-sm">OVF-Provision-MDY</button>
        </div>

        <!-- ၁။ လအလိုက် (Yearly Monthly Comparison) Chart -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Monthly Comparison (Jan - Dec) - Pass vs Fail</h3>
            <div style="height: 300px;"><canvas id="monthlyComparisonChart"></canvas></div>
        </div>

        <!-- ၂။ မူလ OLT Region အလိုက် Chart -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h3 id="olt-chart-title" class="text-lg font-bold text-gray-800 mb-4">OLT Region Performance</h3>
            <div style="height: 300px;"><canvas id="oltChart"></canvas></div>
        </div>

        <!-- ၃။ Failure Reasons Doughnut Chart -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Failure Reasons Breakdown</h3>
            <div style="height: 300px;"><canvas id="failureChart"></canvas></div>
        </div>

    </main>

    <!-- JavaScript Execution Block -->
    <script>
        // Global Variables
        let rawDataSet = [];
        let filteredData = [];
        let currentTestType = 'first';
        let currentRegion = 'All';

        let monthlyComparisonChartInstance = null;
        let oltChartInstance = null;
        let failureChartInstance = null;

        // Helper Functions for Data Parsing
        function getVal(row, key) {
            return row[key] !== undefined && row[key] !== null ? String(row[key]).trim() : '';
        }

        function getStatus(row, key) {
            return getVal(row, key).toLowerCase();
        }

        function getDateObj(row) {
            let dateStr = getVal(row, 'Date') || getVal(row, 'Timestamp');
            return dateStr ? new Date(dateStr) : null;
        }

        function monthNames_getCode(dateObj) {
            const codes = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            return codes[dateObj.getMonth()];
        }

        // Switch Test Type Tab Function
        function switchTestType(type) {
            currentTestType = type;
            
            // Update active tab styling
            ['first', 'second', 'exchange', 'weekly', 'monthly'].forEach(t => {
                let btn = document.getElementById('tab-' + t);
                if (btn) {
                    if (t === type) {
                        btn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold text-white bg-indigo-500 shadow transition";
                    } else {
                        btn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold text-indigo-200 hover:text-white transition";
                    }
                }
            });

            loadDataForActiveTest();
        }

        // Filter By Region Function
        function filterByRegion(region) {
            currentRegion = region;
            if (region === 'All') {
                filteredData = [...rawDataSet];
            } else {
                filteredData = rawDataSet.filter(row => getVal(row, 'Olt Hostname') === region);
            }
            renderCharts(rawDataSet, filteredData);
        }

        // Load Data Source based on Test Type
        function loadDataForActiveTest() {
            // Sample test data for initial load and smooth rendering
            if (rawDataSet.length === 0) {
                rawDataSet = [
                    { 'Date': '2026-01-15', 'Olt Hostname': 'OVF-Provision-HGAO', 'Overall Pass/Fail': 'pass', 'Rx Pass/Fail': 'pass', 'Bias Pass/Fail': 'pass', 'Temp Pass/Fail': 'pass', 'Tx Pass/Fail': 'pass', 'Voltage Pass/Fail': 'pass' },
                    { 'Date': '2026-02-20', 'Olt Hostname': 'OVF-Provision-ENUO', 'Overall Pass/Fail': 'fail', 'Rx Pass/Fail': 'fail', 'Bias Pass/Fail': 'pass', 'Temp Pass/Fail': 'pass', 'Tx Pass/Fail': 'pass', 'Voltage Pass/Fail': 'pass' },
                    { 'Date': '2026-03-10', 'Olt Hostname': 'OVF-Provision-MDY', 'Overall Pass/Fail': 'pass', 'Rx Pass/Fail': 'pass', 'Bias Pass/Fail': 'pass', 'Temp Pass/Fail': 'pass', 'Tx Pass/Fail': 'pass', 'Voltage Pass/Fail': 'pass' }
                ];
            }
            filteredData = [...rawDataSet];
            renderCharts(rawDataSet, filteredData);
        }

        // Render Charts Function (Monthly Comparison + OLT + Failure)
        function renderCharts(rawDataSet, filteredData) {
            
            // ၁။ လအလိုက် Comparison Chart (Jan - Dec)
            let monthsLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            let monthCodes = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            let mTotals = [], mPassed = [], mFailed = [];

            monthCodes.forEach(mCode => {
                let mData = rawDataSet.filter(row => {
                    let d = getDateObj(row);
                    return d && monthNames_getCode(d) === mCode;
                });
                if (currentRegion !== 'All') {
                    mData = mData.filter(row => getVal(row, 'Olt Hostname') === currentRegion);
                }
                let tot = mData.length;
                let pas = mData.filter(row => getStatus(row, 'Overall Pass/Fail') === 'pass').length;
                mTotals.push(tot);
                mPassed.push(pas);
                mFailed.push(tot - pas);
            });

            if (monthlyComparisonChartInstance) monthlyComparisonChartInstance.destroy();
            monthlyComparisonChartInstance = new Chart(document.getElementById('monthlyComparisonChart'), {
                type: 'bar',
                data: {
                    labels: monthsLabels,
                    datasets: [
                        { label: 'Total Tested', data: mTotals, backgroundColor: '#3B82F6', borderRadius: 4 },
                        { label: 'Passed', data: mPassed, backgroundColor: '#10B981', borderRadius: 4 },
                        { label: 'Failed', data: mFailed, backgroundColor: '#EF4444', borderRadius: 4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
            });


            // ၂။ မူလ OLT Region Chart
            let regionsList = ['OVF-Provision-HGAO', 'OVF-Provision-ENUO', 'OVF-Provision-MDY'];
            let oltTotals = [], oltPassed = [], oltFailed = [];

            regionsList.forEach(reg => {
                let rData = filteredData.filter(row => getVal(row, 'Olt Hostname') === reg);
                let tot = rData.length;
                let pas = rData.filter(row => getStatus(row, 'Overall Pass/Fail') === 'pass').length;
                oltTotals.push(tot);
                oltPassed.push(pas);
                oltFailed.push(tot - pas);
            });

            if (oltChartInstance) oltChartInstance.destroy();
            oltChartInstance = new Chart(document.getElementById('oltChart'), {
                type: 'bar',
                data: {
                    labels: regionsList,
                    datasets: [
                        { label: 'Total Tested', data: oltTotals, backgroundColor: '#3B82F6', borderRadius: 4 },
                        { label: 'Passed', data: oltPassed, backgroundColor: '#10B981', borderRadius: 4 },
                        { label: 'Failed', data: oltFailed, backgroundColor: '#EF4444', borderRadius: 4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
            });


            // ၃။ Failure Reasons Doughnut Chart
            let rxFail = filteredData.filter(row => getStatus(row, 'Rx Pass/Fail') === 'fail').length;
            let biasFail = filteredData.filter(row => getStatus(row, 'Bias Pass/Fail') === 'fail').length;
            let tempFail = filteredData.filter(row => getStatus(row, 'Temp Pass/Fail') === 'fail').length;
            let txFail = filteredData.filter(row => getStatus(row, 'Tx Pass/Fail') === 'fail').length;
            let voltFail = filteredData.filter(row => getStatus(row, 'Voltage Pass/Fail') === 'fail').length;

            if (failureChartInstance) failureChartInstance.destroy();
            failureChartInstance = new Chart(document.getElementById('failureChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Rx Power', 'Bias Current', 'Temperature', 'Tx Power', 'Voltage'],
                    datasets: [{
                        data: [rxFail, biasFail, tempFail, txFail, voltFail],
                        backgroundColor: ['#3B82F6', '#8B5CF6', '#10B981', '#F59E0B', '#EC4899']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        // Initialize on page load
        window.onload = function() {
            loadDataForActiveTest();
        };
    </script>
</body>
</html>
