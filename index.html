<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONU Inspection Report Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for CSV reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header & Test Switcher Tabs -->
    <header class="bg-indigo-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2 rounded-lg text-indigo-700 font-black shadow">ONU</div>
                <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide">ONU Inspection Report Dashboard</h1>
            </div>
            
            <!-- Test Switcher Tabs -->
            <div class="flex flex-wrap bg-indigo-900/60 p-1.5 rounded-xl shadow-inner gap-1">
                <button id="tab-first" onclick="switchTestType('first')" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-white bg-indigo-500 shadow transition">First Test</button>
                <button id="tab-second" onclick="switchTestType('second')" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-indigo-200 hover:text-white transition">Second Test</button>
                <button id="tab-exchange" onclick="switchTestType('exchange')" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-indigo-200 hover:text-white transition">Exchange</button>
                <button id="tab-weekly" onclick="switchTestType('weekly')" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-indigo-200 hover:text-white transition">Weekly</button>
                <button id="tab-monthly" onclick="switchTestType('monthly')" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-indigo-200 hover:text-white transition">Monthly</button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- KPI Cards Summary -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total Tested</p>
                <p id="kpi-total" class="text-2xl font-bold text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-emerald-500">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Passed</p>
                <p id="kpi-passed" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-rose-500">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Failed</p>
                <p id="kpi-failed" class="text-2xl font-bold text-rose-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-indigo-500">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Pass Rate</p>
                <p id="kpi-pass-rate" class="text-2xl font-bold text-indigo-600 mt-1">0.00%</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-amber-500 col-span-2 sm:col-span-1">
                <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Fail Rate</p>
                <p id="kpi-fail-rate" class="text-2xl font-bold text-amber-600 mt-1">0.00%</p>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <!-- Region Filter Buttons -->
            <div class="flex flex-wrap gap-2" id="region-filters">
                <button onclick="filterByRegion('All')" class="px-3.5 py-2 bg-indigo-600 text-white rounded-lg shadow-sm font-medium text-xs tracking-wide">All Regions</button>
                <button onclick="filterByRegion('OVF-Provision-HGAO')" class="px-3.5 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium text-xs tracking-wide transition">HGAO</button>
                <button onclick="filterByRegion('OVF-Provision-ENUO')" class="px-3.5 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium text-xs tracking-wide transition">ENUO</button>
                <button onclick="filterByRegion('OVF-Provision-MDY')" class="px-3.5 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium text-xs tracking-wide transition">MDY</button>
            </div>
            <!-- Dynamic Sub-filters (Monthly/Weekly options) -->
            <div id="sub-filter-container" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <!-- OLT / Monthly Comparison Chart Container -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 id="olt-chart-title" class="text-base font-bold text-gray-800 mb-4">Pass vs Fail & Total Comparison</h3>
                <div class="relative h-72"><canvas id="oltChart"></canvas></div>
            </div>

            <!-- Failure Reasons Doughnut Chart Container -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-base font-bold text-gray-800 mb-4">Failure Reasons Breakdown</h3>
                <div class="relative h-72"><canvas id="failureChart"></canvas></div>
            </div>
        </div>

        <!-- Tables Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Parameter Failure Table -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                <h3 class="text-base font-bold text-gray-800 mb-4">Parameter Failure Breakdown</h3>
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-700 uppercase text-xs tracking-wider">
                        <tr>
                            <th class="px-4 py-3">Parameter</th>
                            <th class="px-4 py-3 text-right">Failure Count</th>
                            <th class="px-4 py-3 text-right">Share (%)</th>
                        </tr>
                    </thead>
                    <tbody id="parameter-table-body" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>

            <!-- Summary Table -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                <h3 class="text-base font-bold text-gray-800 mb-4">Summary Breakdown</h3>
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-700 uppercase text-xs tracking-wider">
                        <tr>
                            <th class="px-4 py-3">Category</th>
                            <th class="px-4 py-3 text-right">Total</th>
                            <th class="px-4 py-3 text-right">Passed</th>
                            <th class="px-4 py-3 text-right">Failed</th>
                            <th class="px-4 py-3 text-right">Fail Rate</th>
                        </tr>
                    </thead>
                    <tbody id="device-table-body" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- JavaScript Execution Block -->
    <script>
        // Global State Variables
        let allData = {
            first: [],
            second: [],
            exchange: [],
            weekly: [],
            monthly: [],
            summary: []
        };
        
        let currentTestType = 'first';
        let currentRegion = 'All';
        let currentWeek = 'comparison';
        let currentMonth = 'comparison';

        let oltChartInstance = null;
        let failureChartInstance = null;

        // Helper Functions
        function getVal(row, key) {
            return row[key] !== undefined && row[key] !== null ? String(row[key]).trim() : '';
        }

        function getStatus(row, key) {
            return getVal(row, key).toLowerCase();
        }

        function getDateObj(row) {
            let dateStr = getVal(row, 'Date') || getVal(row, 'Timestamp');
            return dateStr ? new Date(dateStr) : null;
        }

        function monthNames_getCode(d) {
            const monthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            return monthNames[d.getMonth()];
        }

        function getCurrentActiveDataset() {
            return allData[currentTestType] || [];
        }

        // Switch Test Type Tab Function
        function switchTestType(type) {
            currentTestType = type;
            currentWeek = 'comparison';
            currentMonth = 'comparison';
            
            // Update Tab Active Styles
            ['first', 'second', 'exchange', 'weekly', 'monthly'].forEach(t => {
                let btn = document.getElementById('tab-' + t);
                if (btn) {
                    if (t === type) {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-white bg-indigo-500 shadow transition";
                    } else {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold text-indigo-200 hover:text-white transition";
                    }
                }
            });

            renderSubFilters();
            updateDashboard();
        }

        // Render Sub-filters for Monthly/Weekly
        function renderSubFilters() {
            const container = document.getElementById('sub-filter-container');
            container.innerHTML = '';

            if (currentTestType === 'monthly') {
                const months = [
                    { id: 'comparison', label: 'Jan-Dec Comparison' },
                    { id: 'jan', label: 'Jan' }, { id: 'feb', label: 'Feb' }, { id: 'mar', label: 'Mar' },
                    { id: 'apr', label: 'Apr' }, { id: 'may', label: 'May' }, { id: 'jun', label: 'Jun' },
                    { id: 'jul', label: 'Jul' }, { id: 'aug', label: 'Aug' }, { id: 'sep', label: 'Sep' },
                    { id: 'oct', label: 'Oct' }, { id: 'nov', label: 'Nov' }, { id: 'dec', label: 'Dec' }
                ];
                months.forEach(m => {
                    let isActive = currentMonth === m.id;
                    container.innerHTML += `<button onclick="setMonthlyView('${m.id}')" class="px-2.5 py-1 ${isActive ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'} rounded-lg text-xs font-medium shadow-sm transition">${m.label}</button>`;
                });
            }
        }

        function setMonthlyView(m) {
            currentMonth = m;
            renderSubFilters();
            updateDashboard();
        }

        function filterByRegion(region) {
            currentRegion = region;
            updateDashboard();
        }

        // Core Update Dashboard Function
        function updateDashboard() {
            let rawDataSet = getCurrentActiveDataset();

            if (!rawDataSet || rawDataSet.length === 0) {
                document.getElementById('kpi-total').innerText = '0';
                document.getElementById('kpi-passed').innerText = '0';
                document.getElementById('kpi-failed').innerText = '0';
                document.getElementById('kpi-pass-rate').innerText = '0.00%';
                document.getElementById('kpi-fail-rate').innerText = '0.00%';
                
                renderCharts([], []);
                renderTables([]);
                return;
            }

            let filteredData = rawDataSet;

            if (currentTestType === 'monthly') {
                if (currentMonth !== 'comparison') {
                    filteredData = rawDataSet.filter(row => {
                        let d = getDateObj(row);
                        if (d) {
                            return monthNames_getCode(d) === currentMonth;
                        }
                        return false;
                    });
                }
            }

            if (currentRegion !== 'All') {
                filteredData = filteredData.filter(row => getVal(row, 'Olt Hostname') === currentRegion);
            }

            let totalTested = filteredData.length;
            let passedCount = filteredData.filter(row => getStatus(row, 'Overall Pass/Fail') === 'pass').length;
            let failedCount = totalTested - passedCount;
            let passRate = totalTested > 0 ? ((passedCount / totalTested) * 100).toFixed(2) + '%' : '0.00%';
            let failRate = totalTested > 0 ? ((failedCount / totalTested) * 100).toFixed(2) + '%' : '0.00%';

            document.getElementById('kpi-total').innerText = totalTested.toLocaleString();
            document.getElementById('kpi-passed').innerText = passedCount.toLocaleString();
            document.getElementById('kpi-failed').innerText = failedCount.toLocaleString();
            document.getElementById('kpi-pass-rate').innerText = passRate;
            document.getElementById('kpi-fail-rate').innerText = failRate;

            let testTitlePrefix = currentTestType === 'first' ? 'First Test' : 
                                  (currentTestType === 'exchange' ? 'Exchange Devices' : 
                                  (currentTestType === 'weekly' ? `Weekly` : 
                                  (currentTestType === 'monthly' ? (currentMonth === 'comparison' ? 'Monthly Comparison (Jan - Dec)' : `Monthly (${currentMonth.toUpperCase()})`) : 'Second Test')));
            
            document.getElementById('olt-chart-title').innerText = currentRegion === 'All' ?  
                `${testTitlePrefix} - Pass vs Fail Comparison` : `${testTitlePrefix} (${currentRegion})`;

            renderCharts(rawDataSet, filteredData);
            renderTables(filteredData);
        }

        // Render Charts Function
        function renderCharts(rawDataSet, filteredData) {
            if (currentTestType === 'monthly' && currentMonth === 'comparison') {
                let monthsLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                let monthCodes = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
                let mTotals = [], mPassed = [], mFailed = [];

                monthCodes.forEach(mCode => {
                    let mData = rawDataSet.filter(row => {
                        let d = getDateObj(row);
                        if (d) {
                            return monthNames_getCode(d) === mCode;
                        }
                        return false;
                    });
                    if (currentRegion !== 'All') {
                        mData = mData.filter(row => getVal(row, 'Olt Hostname') === currentRegion);
                    }
                    let tot = mData.length;
                    let pas = mData.filter(row => getStatus(row, 'Overall Pass/Fail') === 'pass').length;
                    mTotals.push(tot);
                    mPassed.push(pas);
                    mFailed.push(tot - pas);
                });

                if(oltChartInstance) oltChartInstance.destroy();
                oltChartInstance = new Chart(document.getElementById('oltChart'), {
                    type: 'bar',
                    data: {
                        labels: monthsLabels,
                        datasets: [
                            { label: 'Total Tested', data: mTotals, backgroundColor: '#3B82F6', borderRadius: 4 },
                            { label: 'Passed', data: mPassed, backgroundColor: '#10B981', borderRadius: 4 },
                            { label: 'Failed', data: mFailed, backgroundColor: '#EF4444', borderRadius: 4 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
                });

            } else {
                let regionsList = ['OVF-Provision-HGAO', 'OVF-Provision-ENUO', 'OVF-Provision-MDY'];
                let oltTotals = [], oltPassed = [], oltFailed = [];

                regionsList.forEach(reg => {
                    let rData = filteredData.filter(row => getVal(row, 'Olt Hostname') === reg);
                    let tot = rData.length;
                    let pas = rData.filter(row => getStatus(row, 'Overall Pass/Fail') === 'pass').length;
                    oltTotals.push(tot);
                    oltPassed.push(pas);
                    oltFailed.push(tot - pas);
                });

                if(oltChartInstance) oltChartInstance.destroy();
                oltChartInstance = new Chart(document.getElementById('oltChart'), {
                    type: 'bar',
                    data: {
                        labels: ['HGAO', 'ENUO', 'MDY'],
                        datasets: [
                            { label: 'Total Tested', data: oltTotals, backgroundColor: '#3B82F6', borderRadius: 4 },
                            { label: 'Passed', data: oltPassed, backgroundColor: '#10B981', borderRadius: 4 },
                            { label: 'Failed', data: oltFailed, backgroundColor: '#EF4444', borderRadius: 4 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
                });
            }

            // Failure Doughnut Chart
            let rxFail = filteredData.filter(row => getStatus(row, 'Rx Pass/Fail') === 'fail').length;
            let biasFail = filteredData.filter(row => getStatus(row, 'Bias Pass/Fail') === 'fail').length;
            let tempFail = filteredData.filter(row => getStatus(row, 'Temp Pass/Fail') === 'fail').length;
            let txFail = filteredData.filter(row => getStatus(row, 'Tx Pass/Fail') === 'fail').length;
            let voltFail = filteredData.filter(row => getStatus(row, 'Voltage Pass/Fail') === 'fail').length;

            if(failureChartInstance) failureChartInstance.destroy();
            failureChartInstance = new Chart(document.getElementById('failureChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Rx Power', 'Bias Current', 'Temperature', 'Tx Power', 'Voltage'],
                    datasets: [{
                        data: [rxFail, biasFail, tempFail, txFail, voltFail],
                        backgroundColor: ['#3B82F6', '#8B5CF6', '#10B981', '#F59E0B', '#EC4899']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        // Render Tables Function
        function renderTables(data) {
            const paramTable = document.getElementById('parameter-table-body');
            const deviceTable = document.getElementById('device-table-body');

            if (currentTestType === 'monthly' && currentMonth === 'comparison') {
                paramTable.innerHTML = '';
                deviceTable.innerHTML = '';

                let monthCodes = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
                let monthLabels = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                
                let grandTotal = 0, grandPassed = 0, grandFailed = 0;

                monthCodes.forEach((mCode, idx) => {
                    let mRows = allData.monthly.filter(row => {
                        let d = getDateObj(row);
                        return d && monthNames_getCode(d) === mCode;
                    });
                    if (currentRegion !== 'All') {
                        mRows = mRows.filter(row => getVal(row, 'Olt Hostname') === currentRegion);
                    }

                    let mTot = mRows.length;
                    let mPas = mRows.filter(row => getStatus(row, 'Overall Pass/Fail') === 'pass').length;
                    let mFai = mTot - mPas;
                    let mRate = mTot > 0 ? ((mFai / mTot) * 100).toFixed(2) + '%' : '0.00%';

                    grandTotal += mTot;
                    grandPassed += mPas;
                    grandFailed += mFai;

                    deviceTable.innerHTML += `
                        <tr class="hover:bg-gray-50/50">
                            <td class="px-4 py-3 font-medium text-gray-900">${monthLabels[idx]}</td>
                            <td class="px-4 py-3 text-right text-gray-700">${mTot.toLocaleString()}</td>
                            <td class="px-4 py-3 text-right text-emerald-600 font-medium">${mPas.toLocaleString()}</td>
                            <td class="px-4 py-3 text-right text-rose-600 font-medium">${mFai.toLocaleString()}</td>
                            <td class="px-4 py-3 text-right text-gray-600 font-semibold">${mRate}</td>
                        </tr>`;
                });

                let overallRate = grandTotal > 0 ? ((grandFailed / grandTotal) * 100).toFixed(2) + '%' : '0.00%';
                deviceTable.innerHTML += `
                    <tr class="bg-gray-50/80 font-bold border-t border-gray-200">
                        <td class="px-4 py-3 text-gray-900">Total (Yearly)</td>
                        <td class="px-4 py-3 text-right text-gray-900">${grandTotal.toLocaleString()}</td>
                        <td class="px-4 py-3 text-right text-emerald-600">${grandPassed.toLocaleString()}</td>
                        <td class="px-4 py-3 text-right text-rose-600">${grandFailed.toLocaleString()}</td>
                        <td class="px-4 py-3 text-right text-gray-900">${overallRate}</td>
                    </tr>`;

                let rxFail = allData.monthly.filter(row => getStatus(row, 'Rx Pass/Fail') === 'fail').length;
                let biasFail = allData.monthly.filter(row => getStatus(row, 'Bias Pass/Fail') === 'fail').length;
                let tempFail = allData.monthly.filter(row => getStatus(row, 'Temp Pass/Fail') === 'fail').length;
                let txFail = allData.monthly.filter(row => getStatus(row, 'Tx Pass/Fail') === 'fail').length;
                let voltFail = allData.monthly.filter(row => getStatus(row, 'Voltage Pass/Fail') === 'fail').length;
                
                let totalParamFail = rxFail + biasFail + tempFail + txFail + voltFail;
                let params = [
                    { name: 'Rx Power', count: rxFail, share: totalParamFail ? ((rxFail/totalParamFail)*100).toFixed(2) + '%' : '0%' },
                    { name: 'Bias Current', count: biasFail, share: totalParamFail ? ((biasFail/totalParamFail)*100).toFixed(2) + '%' : '0%' },
                    { name: 'Temperature', count: tempFail, share: totalParamFail ? ((tempFail/totalParamFail)*100).toFixed(2) + '%' : '0%' },
                    { name: 'Tx Power', count: txFail, share: totalParamFail ? ((txFail/totalParamFail)*100).toFixed(2) + '%' : '0%' },
                    { name: 'Voltage', count: voltFail, share: totalParamFail ? ((voltFail/totalParamFail)*100).toFixed(2) + '%' : '0%' }
                ];

                params.forEach(p => {
                    paramTable.innerHTML += `
                        <tr class="hover:bg-gray-50/50">
                            <td class="px-4 py-3 font-medium text-gray-900">${p.name}</td>
                            <td class="px-4 py-3 text-right text-rose-600 font-semibold">${p.count}</td>
                            <td class="px-4 py-3 text-right text-gray-600">${p.share}</td>
                        </tr>`;
                });
                paramTable.innerHTML += `
                    <tr class="bg-gray-50/80 font-bold border-t border-gray-200">
                        <td class="px-4 py-3 text-gray-900">Total</td>
                        <td class="px-4 py-3 text-right text-rose-600">${totalParamFail}</td>
                        <td class="px-4 py-3 text-right text-gray-900">100.00%</td>
                    </tr>`;

            } else {
                let rxFail = data.filter(row => getStatus(row, 'Rx Pass/Fail') === 'fail').length;
                let biasFail = data.filter(row => getStatus(row, 'Bias Pass/Fail') === 'fail').length;
                let tempFail = data.filter(row => getStatus(row, 'Temp Pass/Fail') === 'fail').length;
                let txFail = data.filter(row => getStatus(row, 'Tx Pass/Fail') === 'fail').length;
                let voltFail = data.filter(row => getStatus(row, 'Voltage Pass/Fail') === 'fail').length;
                
                let totalParamFail = rxFail + biasFail + tempFail + txFail + voltFail;

                let params = [
                    { name: 'Rx Power', count: rxFail, share: totalParamFail ? ((rxFail/totalParamFail)*100).toFixed(2) + '%' : '0%' },
                    { name: 'Bias Current', count: biasFail, share: totalParamFail ? ((biasFail/totalParamFail)*100).toFixed(2) + '%' : '0%' },
                    { name: 'Temperature', count: tempFail, share: totalParamFail ? ((tempFail/totalParamFail)*100).toFixed(2) + '%' : '0%' },
                    { name: 'Tx Power', count: txFail, share: totalParamFail ? ((txFail/totalParamFail)*100).toFixed(2) + '%' : '0%' },
                    { name: 'Voltage', count: voltFail, share: totalParamFail ? ((voltFail/totalParamFail)*100).toFixed(2) + '%' : '0%' }
                ];

                paramTable.innerHTML = '';
                params.forEach(p => {
                    paramTable.innerHTML += `
                        <tr class="hover:bg-gray-50/50">
                            <td class="px-4 py-3 font-medium text-gray-900">${p.name}</td>
                            <td class="px-4 py-3 text-right text-rose-600 font-semibold">${p.count}</td>
                            <td class="px-4 py-3 text-right text-gray-600">${p.share}</td>
                        </tr>`;
                });
                paramTable.innerHTML += `
                    <tr class="bg-gray-50/80 font-bold border-t border-gray-200">
                        <td class="px-4 py-3 text-gray-900">Total</td>
                        <td class="px-4 py-3 text-right text-rose-600">${totalParamFail}</td>
                        <td class="px-4 py-3 text-right text-gray-900">100.00%</td>
                    </tr>`;

                let deviceNames = ['FFO', 'FFG', 'SCP', 'FFA', 'BFFA'];
                deviceTable.innerHTML = '';

                let sumTot = 0, sumPas = 0, sumFai = 0;
                deviceNames.forEach(dev => {
                    let dRows = data.filter(row => getVal(row, 'Devices Name').toUpperCase() === dev);
                    let dTot = dRows.length;
                    let dPas = dRows.filter(row => getStatus(row, 'Overall Pass/Fail') === 'pass').length;
                    let dFai = dTot - dPas;
                    let dRate = dTot > 0 ? ((dFai / dTot) * 100).toFixed(2) + '%' : '0.00%';

                    sumTot += dTot;
                    sumPas += dPas;
                    sumFai += dFai;

                    deviceTable.innerHTML += `
                        <tr class="hover:bg-gray-50/50">
                            <td class="px-4 py-3 font-medium text-gray-900">${dev}</td>
                            <td class="px-4 py-3 text-right text-gray-700">${dTot.toLocaleString()}</td>
                            <td class="px-4 py-3 text-right text-emerald-600 font-medium">${dPas.toLocaleString()}</td>
                            <td class="px-4 py-3 text-right text-rose-600 font-medium">${dFai}</td>
                            <td class="px-4 py-3 text-right text-gray-600 font-semibold">${dRate}</td>
                        </tr>`;
                });

                let overallFailRate = sumTot > 0 ? ((sumFai / sumTot) * 100).toFixed(2) + '%' : '0.00%';
                deviceTable.innerHTML += `
                    <tr class="bg-gray-50/80 font-bold border-t border-gray-200">
                        <td class="px-4 py-3 text-gray-900">Total</td>
                        <td class="px-4 py-3 text-right text-gray-900">${sumTot.toLocaleString()}</td>
                        <td class="px-4 py-3 text-right text-emerald-600">${sumPas.toLocaleString()}</td>
                        <td class="px-4 py-3 text-right text-rose-600">${sumFai}</td>
                        <td class="px-4 py-3 text-right text-gray-900">${overallFailRate}</td>
                    </tr>`;
            }
        }
