<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified ISP Operations Dashboard - Staff KPI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f5f7; }
        .strict-row-nav { display: flex; flex-wrap: nowrap !important; overflow-x: auto; gap: 6px; align-items: center; }
        .strict-row-nav::-webkit-scrollbar { height: 4px; }
        .strict-row-nav::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="text-slate-900 font-semibold p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Staff Name Buttons Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div id="staff-buttons-container" class="strict-row-nav py-2">
                <!-- Dynamically loaded staff buttons -->
            </div>
        </div>

        <!-- Staff Details Card -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex items-center space-x-3 border-b border-slate-100 pb-4">
                <span class="bg-blue-100 text-blue-600 p-3 rounded-xl font-bold">👤</span>
                <div>
                    <h2 id="active-staff-name" class="text-xl font-extrabold text-slate-900">Aung Aung14</h2>
                    <p class="text-xs text-slate-400 font-bold">Performance & Daily Activities</p>
                </div>
            </div>

            <!-- Leave Notices (Dynamic) -->
            <div id="staff-leave-notices" class="space-y-2">
                <!-- Populated via JS -->
            </div>

            <!-- Staff Activity Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs text-slate-400 uppercase tracking-wider bg-slate-50">
                            <th class="py-3 px-4">DATE</th>
                            <th class="py-3 px-4">DEVICE NAME</th>
                            <th class="py-3 px-4">DAILY (JD)</th>
                            <th class="py-3 px-4 text-right">TOTAL</th>
                        </tr>
                    </thead>
                    <tbody id="staff-table-body" class="text-sm divide-y divide-slate-100">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const staffList = [
            "Aung Aung14", "Aung Myint Myat", "Aung Zaw Htet", "Chit Bhone", 
            "Htet Myat Hlaing", "Htet Naing Win4", "Min Maw Kun2", "Myat Htet Kyaw", 
            "Myat Zaw Soe", "Myint Kyaw Aung", "Myo Aung", "Phyo Wai Aung", 
            "Soe Hua", "Win Ko Oo", "Zin Khant"
        ];

        // Sample leave records mapping for demonstration
        const leaveRecords = {
            "Aung Aung14": ["2026-10-12", "2026-10-13"],
            "Chit Bhone": ["2026-10-10"],
            "Win Ko Oo": ["2026-10-08", "2026-10-09"]
        };

        function initStaffKpi() {
            let container = document.getElementById('staff-buttons-container');
            container.innerHTML = "";
            staffList.forEach((name, idx) => {
                let btn = document.createElement('button');
                btn.innerText = name;
                btn.className = idx === 0 
                    ? 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow whitespace-nowrap' 
                    : 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap';
                btn.onclick = () => selectStaff(name, btn);
                container.appendChild(btn);
            });

            selectStaff(staffList[0], container.children[0]);
        }

        function selectStaff(name, btnElement) {
            document.querySelectorAll('#staff-buttons-container button').forEach(b => {
                b.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 whitespace-nowrap';
            });
            btnElement.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow whitespace-nowrap';
            document.getElementById('active-staff-name').innerText = name;

            // Render Leave Notices if available for this staff
            let leaveDiv = document.getElementById('staff-leave-notices');
            let staffLeaves = leaveRecords[name] || [];
            if (staffLeaves.length > 0) {
                leaveDiv.innerHTML = staffLeaves.map(date => `
                    <div class="p-3 bg-amber-50 border-l-4 border-amber-500 text-amber-800 text-xs font-bold rounded-r-xl">
                        ⚠️ ${name} is on Leave on ${date}
                    </div>
                `).join('');
            } else {
                leaveDiv.innerHTML = `
                    <div class="p-3 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-800 text-xs font-bold rounded-r-xl">
                        ✅ No leave records for ${name}. Active on duty.
                    </div>
                `;
            }

            // Render table activities
            let tbody = document.getElementById('staff-table-body');
            tbody.innerHTML = `
                <tr class="hover:bg-slate-50/50">
                    <td class="py-3 px-4 text-slate-600 align-middle">2026-10-02</td>
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle">ECJ</td>
                    <td class="py-3 px-4 text-slate-700">Speed Test</td>
                    <td class="py-3 px-4 text-right font-bold text-blue-600 align-middle">220</td>
                </tr>
                <tr class="hover:bg-slate-50/50 border-b border-slate-100">
                    <td class="py-3 px-4 text-slate-600 align-middle"></td>
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle">FFO</td>
                    <td class="py-3 px-4 text-slate-700">MAC</td>
                    <td class="py-3 px-4 text-right font-bold text-blue-600 align-middle">17</td>
                </tr>
                <tr class="bg-slate-50/80 font-bold">
                    <td colspan="3" class="py-2.5 px-4 text-right text-slate-500 text-xs uppercase">Total for 2026-10-02:</td>
                    <td class="py-2.5 px-4 text-right text-slate-900">237</td>
                </tr>
                <tr class="hover:bg-slate-50/50">
                    <td class="py-3 px-4 text-slate-600 align-middle">2026-10-05</td>
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle">FFG</td>
                    <td class="py-3 px-4 text-slate-700">Cleaning</td>
                    <td class="py-3 px-4 text-right font-bold text-blue-600 align-middle">310</td>
                </tr>
                <tr class="bg-slate-50/80 font-bold">
                    <td colspan="3" class="py-2.5 px-4 text-right text-slate-500 text-xs uppercase">Total for 2026-10-05:</td>
                    <td class="py-2.5 px-4 text-right text-slate-900">310</td>
                </tr>
                <tr class="hover:bg-slate-50/50">
                    <td class="py-3 px-4 text-slate-600 align-middle" rowspan="2">2026-10-06</td>
                    <td class="py-3 px-4 font-bold text-slate-800 align-middle" rowspan="2">FFG</td>
                    <td class="py-3 px-4 text-slate-700">Cleaning</td>
                    <td class="py-3 px-4 text-right font-bold text-blue-600 align-middle">42</td>
                </tr>
                <tr class="hover:bg-slate-50/50 border-b border-slate-100">
                    <td class="py-3 px-4 text-slate-700">Default</td>
                    <td class="py-3 px-4 text-right font-bold text-blue-600 align-middle">19</td>
                </tr>
                <tr class="bg-slate-50/80 font-bold">
                    <td colspan="3" class="py-2.5 px-4 text-right text-slate-500 text-xs uppercase">Total for 2026-10-06:</td>
                    <td class="py-2.5 px-4 text-right text-slate-900">161</td>
                </tr>
            `;
        }

        window.onload = function() {
            initStaffKpi();
        };
    </script>
</body>
</html>
